name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: |
          go vet ./...
          go vet -tags e2e ./...
      # Unit tests only. The e2e tests need a real account and must never run in CI.
      - name: test
        run: go test -race ./...
      - name: vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: cross-compile CLI
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/micloud
          done
